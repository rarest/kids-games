<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171126">
  <title>黄金矿工</title>
  <link rel="stylesheet" href="../goldminer/game.css?v=700-20260829">
</head>
<body>
  <main id="game" aria-label="黄金矿工游戏">
    <canvas id="canvas"></canvas>
    <header class="hud">
      <section><span>关卡</span><strong id="level">1</strong></section>
      <section><span>金币</span><strong id="score">0</strong></section>
      <section><span>目标</span><strong id="target">650</strong></section>
      <section class="time"><span>时间</span><strong id="time">60</strong></section>
    </header>
    <div class="controls">
      <button id="bomb" class="bomb" type="button" aria-label="使用炸药">🧨 <b id="bombCount">1</b></button>
      <p id="status">点击矿区放下钩爪</p>
      <button id="sound" class="round" type="button" aria-label="声音开关">🔊</button>
    </div>
    <section id="overlay" class="overlay">
      <div class="card">
        <p class="eyebrow">CLASSIC ARCADE</p>
        <h1>黄金矿工</h1>
        <p>一次发射 700 个钩爪，从不同角度横扫矿区，在倒计时结束前赚够目标金币。</p>
        <div class="tips"><span>🖱️ 点击 / 空格：700 钩齐射</span><span>🧨 回收时：炸掉所有重物</span></div>
        <button id="start" class="primary" type="button">开始挖矿</button>
        <small>最高纪录 <b id="best">0</b></small>
      </div>
    </section>
    <section id="shop" class="overlay hidden">
      <div class="card shop-card">
        <p class="eyebrow">SUPPLY SHOP</p>
        <h2>矿工补给站</h2>
        <p id="shopSummary"></p>
        <div class="shop-row"><span>🧨 炸药</span><button id="buyBomb" type="button">$180 购买</button></div>
        <div class="shop-row"><span>💪 强力卷轴</span><button id="buyPower" type="button">$260 购买</button></div>
        <button id="next" class="primary" type="button">进入下一关</button>
      </div>
    </section>
  </main>
  <script type="module" src="../goldminer/game.js?v=respawn-20260829"></script>
</body>
</html>
